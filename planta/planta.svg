<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" width="760" height="660" font-family="Arial, Helvetica, sans-serif">
  <rect width="760" height="660" fill="#fff"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold">PLANTA BAIXA – 9,00 x 7,00 m</text>

  <!-- pisos -->
  <rect x="100" y="100" width="222" height="210" fill="#f4efe6"/>
  <rect x="418" y="100" width="222" height="210" fill="#f4efe6"/>
  <rect x="322" y="100" width="96" height="138" fill="#e6f0f5"/>
  <rect x="322" y="238" width="96" height="72" fill="#f7f7f2"/>
  <rect x="100" y="310" width="540" height="210" fill="#f7f7f2"/>

  <!-- paredes -->
  <g stroke="#222" stroke-linecap="square" fill="none">
    <rect x="100" y="100" width="540" height="420" stroke-width="9"/>
    <line x1="100" y1="310" x2="640" y2="310" stroke-width="6"/>
    <line x1="322" y1="100" x2="322" y2="310" stroke-width="6"/>
    <line x1="418" y1="100" x2="418" y2="310" stroke-width="6"/>
    <line x1="322" y1="238" x2="418" y2="238" stroke-width="6"/>
  </g>

  <!-- vãos (aberturas) -->
  <g fill="#fff">
    <rect x="317" y="254" width="10" height="48" fill="#f7f7f2"/>
    <rect x="413" y="254" width="10" height="48" fill="#f7f7f2"/>
    <rect x="330" y="233" width="42" height="10" fill="#f7f7f2"/>
    <rect x="325" y="305" width="90" height="10" fill="#f7f7f2"/>
    <rect x="298" y="514" width="54" height="12"/>
  </g>
  <!-- janelas -->
  <g>
    <rect x="160" y="514" width="120" height="12" fill="#fff"/>
    <rect x="460" y="514" width="120" height="12" fill="#fff"/>
    <rect x="160" y="94" width="100" height="12" fill="#fff"/>
    <rect x="480" y="94" width="100" height="12" fill="#fff"/>
    <rect x="345" y="94" width="50" height="12" fill="#fff"/>
  </g>
  <g stroke="#1f5fa8" stroke-width="1.5">
    <line x1="160" y1="517" x2="280" y2="517"/><line x1="160" y1="523" x2="280" y2="523"/>
    <line x1="460" y1="517" x2="580" y2="517"/><line x1="460" y1="523" x2="580" y2="523"/>
    <line x1="160" y1="97" x2="260" y2="97"/><line x1="160" y1="103" x2="260" y2="103"/>
    <line x1="480" y1="97" x2="580" y2="97"/><line x1="480" y1="103" x2="580" y2="103"/>
    <line x1="345" y1="97" x2="395" y2="97"/><line x1="345" y1="103" x2="395" y2="103"/>
  </g>

  <!-- portas -->
  <g stroke="#444" stroke-width="1.5" fill="none">
    <line x1="322" y1="254" x2="274" y2="254"/><path d="M322,302 A48,48 0 0 1 274,254" stroke-dasharray="3 3"/>
    <line x1="418" y1="254" x2="466" y2="254"/><path d="M418,302 A48,48 0 0 0 466,254" stroke-dasharray="3 3"/>
    <line x1="330" y1="238" x2="330" y2="196"/><path d="M372,238 A42,42 0 0 0 330,196" stroke-dasharray="3 3"/>
    <line x1="298" y1="520" x2="298" y2="466"/><path d="M352,520 A54,54 0 0 0 298,466" stroke-dasharray="3 3"/>
  </g>

  <!-- banheiro: box, vaso, pia -->
  <g stroke="#555" stroke-width="1.5" fill="#fff">
    <line x1="326" y1="160" x2="414" y2="160" stroke-dasharray="5 4"/>
    <circle cx="404" cy="150" r="5" fill="none"/>
    <rect x="398" y="186" width="16" height="28"/>
    <ellipse cx="384" cy="200" rx="15" ry="11"/>
    <rect x="326" y="166" width="16" height="26" rx="4"/>
  </g>
  <text x="345" y="155" text-anchor="middle" font-size="9" fill="#555">box</text>

  <!-- divisão opcional cozinha / sala -->
  <line x1="370" y1="380" x2="370" y2="490" stroke="#999" stroke-width="1" stroke-dasharray="6 5"/>
  <!-- bancada cozinha -->
  <rect x="105" y="315" width="150" height="36" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <rect x="160" y="321" width="36" height="24" fill="none" stroke="#555"/>
  <text x="130" y="337" text-anchor="middle" font-size="9" fill="#555">fogão</text>
  <text x="178" y="337" text-anchor="middle" font-size="9" fill="#555">pia</text>

  <!-- nomes e áreas -->
  <g text-anchor="middle" fill="#222">
    <text x="211" y="200" font-size="17" font-weight="bold">QUARTO 1</text>
    <text x="211" y="220" font-size="12">3,70 x 3,50 = 12,95 m²</text>
    <text x="529" y="200" font-size="17" font-weight="bold">QUARTO 2</text>
    <text x="529" y="220" font-size="12">3,70 x 3,50 = 12,95 m²</text>
    <text x="370" y="122" font-size="11" font-weight="bold">BANHEIRO</text><text x="370" y="135" font-size="9">3,68 m²</text>
    <text x="370" y="276" font-size="10" font-weight="bold">CORREDOR</text><text x="370" y="290" font-size="9">1,60 x 1,20</text>
    <text x="220" y="410" font-size="17" font-weight="bold">COZINHA</text>
    <text x="520" y="410" font-size="17" font-weight="bold">SALA</text>
    <text x="520" y="430" font-size="11">sala + cozinha: 9,00 x 3,50 = 31,50 m²</text>
    <text x="325" y="545" font-size="10" fill="#555">entrada</text>
  </g>
  
  <!-- cotas -->
  <g stroke="#c0392b" stroke-width="1" fill="#c0392b" font-size="13">
    <line x1="100" y1="70" x2="640" y2="70" fill="none"/>
    <line x1="100" y1="62" x2="100" y2="78"/><line x1="322" y1="62" x2="322" y2="78"/>
    <line x1="418" y1="62" x2="418" y2="78"/><line x1="640" y1="62" x2="640" y2="78"/>
    <text x="211" y="64" text-anchor="middle" stroke="none">3,70</text>
    <text x="370" y="64" text-anchor="middle" stroke="none">1,60</text>
    <text x="529" y="64" text-anchor="middle" stroke="none">3,70</text>

    <line x1="100" y1="570" x2="640" y2="570"/>
    <line x1="100" y1="562" x2="100" y2="578"/><line x1="640" y1="562" x2="640" y2="578"/>
    <text x="370" y="592" text-anchor="middle" stroke="none">9,00</text>

    <line x1="680" y1="100" x2="680" y2="520"/>
    <line x1="672" y1="100" x2="688" y2="100"/><line x1="672" y1="310" x2="688" y2="310"/><line x1="672" y1="520" x2="688" y2="520"/>
    <text x="692" y="210" stroke="none">3,50</text>
    <text x="692" y="420" stroke="none">3,50</text>

    <line x1="60" y1="100" x2="60" y2="520"/>
    <line x1="52" y1="100" x2="68" y2="100"/><line x1="52" y1="520" x2="68" y2="520"/>
    <text x="48" y="314" text-anchor="middle" stroke="none" transform="rotate(-90 48 314)">x = 7,00</text>
  </g>

  <text x="370" y="625" text-anchor="middle" font-size="12" fill="#333">Área total construída: 9,00 x 7,00 = 63,00 m²  ·  medidas em metros</text>
</svg>
